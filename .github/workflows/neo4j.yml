name: Neo4j integration
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/neo4j.yml'
  workflow_dispatch:
jobs:
  neo4j:
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/test-only-password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p test-only-password 'RETURN 1'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'neo4j>=5.19,<7' 'pytest>=8' 'pytest-asyncio>=0.23'
      - run: pytest tests/test_graph_schema.py tests/test_graph_store.py tests/test_graph_store_integration.py -q
        env:
          NEO4J_TEST_URI: bolt://localhost:7687
          NEO4J_TEST_USERNAME: neo4j
          NEO4J_TEST_PASSWORD: test-only-password
          NEO4J_TEST_DATABASE: neo4j
