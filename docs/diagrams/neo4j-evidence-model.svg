<text x="200.0" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">account + doc_id</text>
<text x="200.0" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">active + revision</text>
<rect x="430" y="145" width="730" height="135" rx="10" fill="#F6F8FA" stroke="#596778" stroke-width="3"/>
<text x="795.0" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#596778">KGChunk</text>
<text x="795.0" y="221" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">account, doc_id, chunk_id, page, text</text>
<text x="795.0" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">One source chunk with links to its entities</text>
<path d="M360,210 L430,210" fill="none" stroke="#596778" stroke-width="3" stroke-dasharray="8 6"/>
<text x="1050" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172A3A">MENTIONS</text>
<path d="M795,280 L220,395" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M795,280 L600,395" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M795,280 L980,395" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="50" y="395" width="340" height="135" rx="10" fill="#F6F8FA" stroke="#215B9A" stroke-width="3"/>
<text x="220.0" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#215B9A">Gene</text>
<text x="220.0" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">BRCA1</text>
<text x="220.0" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Stable entity_id</text>
<rect x="430" y="395" width="340" height="135" rx="10" fill="#F6F8FA" stroke="#215B9A" stroke-width="3"/>
<text x="600.0" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#215B9A">Protein</text>
<text x="600.0" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Protein A</text>
<text x="600.0" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Stable entity_id</text>
<rect x="810" y="395" width="340" height="135" rx="10" fill="#F6F8FA" stroke="#215B9A" stroke-width="3"/>
<text x="980.0" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#215B9A">Disease</text>
<text x="980.0" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Disease A</text>
<text x="980.0" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Stable entity_id</text>
<path d="M390,460 L430,460" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M770,460 L810,460" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<text x="410" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172A3A">ENCODES</text>
<text x="790" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172A3A">ASSOCIATED_WITH</text>
<text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#172A3A">Each medical edge retains its own source</text>
<text x="600" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="400" fill="#172A3A">edge_id  |  account  |  doc_id  |  chunk_id  |  page</text>
<text x="600" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172A3A">Two documents may support the same entity or relationship.</text>
<text x="600" y="791" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="400" fill="#172A3A">Deleting one document removes its evidence and preserves the other.</text>
<text x="600" y="858" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172A3A">Retrieval: Qdrant entity_ids → selected-document graph paths → cited context</text>
<text x="600" y="906" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#172A3A">All path edges stay within the account and selected documents.</text>
<text x="600" y="936" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#172A3A">Dashed line: shared document key. Arrows: stored graph relationships.</text>
</svg>