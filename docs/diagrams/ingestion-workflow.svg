<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020">
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#596778"/></marker></defs>
<rect width="1200" height="1020" fill="white"/>
<text x="600" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#172A3A">Document ingestion and readiness</text>
<text x="600" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Proposed integration sequence and failure handling</text>
<rect x="70" y="120" width="1060" height="112" rx="10" fill="#F6F8FA" stroke="#596778" stroke-width="3"/>
<text x="600.0" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#596778">1  Authorize and prepare</text>
<text x="600" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Shared API and document service</text>
<text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172A3A">Validate PDF, ownership and duplicate policy</text>
<path d="M600,232 L600,248" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="248" width="1060" height="112" rx="10" fill="#F6F8FA" stroke="#596778" stroke-width="3"/>
<text x="600.0" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#596778">2  Start an indexing job</text>
<text x="600" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Shared coordinator</text>
<text x="600" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172A3A">Mark processing, cancel old work, obtain graph revision</text>
<path d="M600,360 L600,376" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="376" width="1060" height="112" rx="10" fill="#F6F8FA" stroke="#596778" stroke-width="3"/>
<text x="600.0" y="414" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#596778">3  Parse and extract</text>
<text x="600" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Shared PDF and extraction services</text>
<text x="600" y="476" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172A3A">Create chunks, validate entity and relationship types</text>
<path d="M600,488 L600,504" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="504" width="1060" height="112" rx="10" fill="#F6F8FA" stroke="#215B9A" stroke-width="3"/>
<text x="600.0" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#215B9A">4  Write graph evidence</text>
<text x="600" y="574" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">You  |  Neo4j</text>
<text x="600" y="604" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172A3A">Upsert chunk with revision; return stable entity_ids</text>
<path d="M600,616 L600,632" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="632" width="1060" height="112" rx="10" fill="#F6F8FA" stroke="#17796F" stroke-width="3"/>
<text x="600.0" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#17796F">5  Embed and write vectors</text>
<text x="600" y="702" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Teammate  |  Qdrant</text>
<text x="600" y="732" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172A3A">Store the same identifiers, source text and entity_ids</text>
<path d="M600,744 L600,760" fill="none" stroke="#596778" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="70" y="760" width="1060" height="112" rx="10" fill="#F6F8FA" stroke="#596778" stroke-width="3"/>
<text x="600.0" y="798" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#596778">6  Publish readiness</text>
<text x="600" y="830" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="400" fill="#172A3A">Shared coordinator and Supabase</text>
<text x="600" y="860" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172A3A">Mark ready only after every chunk succeeds in both stores</text>
<text x="600" y="932" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172A3A">On failure: mark failed, stop old writes and clean partial records in both stores.</text>
<text x="600" y="974" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="400" fill="#172A3A">Graph revisions fence Neo4j writes; Qdrant and job cancellation need coordinated protection.</text>
</svg>