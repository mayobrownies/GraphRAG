services:
  - type: web
    name: graphrag-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: neo4j
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: graphrag_chunks
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_LLM_MODEL
        value: llama3.1
      - key: OLLAMA_EMBED_MODEL
        value: nomic-embed-text
      - key: LOG_LEVEL
        value: info
