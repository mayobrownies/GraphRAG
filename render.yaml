services:
  - type: web
    name: graphrag-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: NEO4J_URI
        value: "neo4j+s://c025f2aa.databases.neo4j.io"
      - key: NEO4J_USERNAME
        value: "c025f2aa"
      - key: NEO4J_PASSWORD
        sync: false
      - key: NEO4J_DATABASE
        value: "c025f2aa"
      - key: QDRANT_URL
        value: "https://e8db2ed7-a36b-4397-b483-16dd11f259b7.us-east-1-1.aws.cloud.qdrant.io"
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: graphrag_chunks
      - key: OLLAMA_BASE_URL
        sync: false
      - key: OLLAMA_LLM_MODEL
        value: qwen3.5:0.8b
      - key: OLLAMA_EMBED_MODEL
        value: qwen3-embedding:0.6b
      - key: SUPABASE_URL
        value: "https://frskupfolawcdnjcsrsk.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        value: "https://frskupfolawcdnjcsrsk.supabase.co/auth/v1/.well-known/jwks.json"
      - key: SUPABASE_STORAGE_BUCKET
        value: "DocumentStore"
      - key: LOG_LEVEL
        value: info
