# Local stack: Neo4j, Qdrant and Ollama run in containers, Supabase stays in the cloud.
# The backend reads .env, and the overrides below point it at the local containers
# so the same .env also works for the Render deploy (Neo4j Aura, Qdrant Cloud).
services:
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_LLM_MODEL:-qwen3.5:0.8b} && ollama pull ${OLLAMA_EMBED_MODEL:-qwen3-embedding:0.6b}"]
    restart: "no"

  backend:
    build: ./backend
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_DATABASE: neo4j
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ""
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on: [neo4j, qdrant, ollama]
    restart: on-failure  # Neo4j takes a few seconds to accept connections on first start
    ports: ["8000:8000"]
    volumes: ["./corpus:/srv/corpus:ro"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_API_URL: ""  # nginx forwards /api to the backend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  neo4j_data:
  qdrant_data:
  ollama_data:
